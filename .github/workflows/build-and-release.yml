name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        type: choice
        required: true
        default: build and release
        options:
          - build and release
          - build and release (force)
          - build only
      version:
        description: Version to release (e.g. 1.2.3 or v1.2.3). If omitted, auto-increments patch from latest tag
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    name: Resolve version
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      tag: ${{ steps.resolve-version.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-tags: true

    - name: Sanitize provided version
      id: sanitize
      if: inputs.version != ''
      uses: ./.github/actions/sanitize-version
      with:
        version: ${{ inputs.version }}

    - name: Auto-increment version from tags
      id: auto-version
      if: inputs.version == ''
      run: |
        latest_tag=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
        if [ -z "$latest_tag" ]; then
          echo "No existing tags found, defaulting to v0.0.1"
          latest_tag="0.0.0"
        fi

        IFS='.' read -r major minor patch <<< "$latest_tag"
        patch=$((patch + 1))
        version="${major}.${minor}.${patch}"
        tag="v${version}"

        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Auto-incremented version: ${version} (from tag: ${latest_tag})"

    - name: Resolve version
      id: resolve-version
      run: |
        if [ -n "${{ steps.sanitize.outputs.version }}" ]; then
          version="${{ steps.sanitize.outputs.version }}"
          tag="${{ steps.sanitize.outputs.tag }}"
        else
          version="${{ steps.auto-version.outputs.version }}"
          tag="${{ steps.auto-version.outputs.tag }}"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Resolved version: ${version}, tag: ${tag}"

  build:
    name: Build
    needs: version
    strategy:
      matrix:
        arch:
          - x64
          - x86
    uses: ./.github/workflows/build.yml
    with:
      arch: ${{ matrix.arch }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    permissions:
      contents: write
    if: success() && (inputs.build_mode == 'build and release' || inputs.build_mode == 'build and release (force)')

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ./artifacts/temp
        pattern: VolumeKeeper-*

    - name: Extract artifacts
      run: |
        cd artifacts

        echo "=== Current folder (before extracting) ==="
        pwd
        ls -la
        echo "=== Current temp folder (before extracting) ==="
        ls -la temp

        for zip in ./temp/*/*.zip; do unzip "$zip"; done

        echo "=== Current folder (during extraction) ==="
        ls -la
        rm -r ./temp

        find . -type f -empty -print -delete -o -type d -empty -print -delete
        echo "=== Current folder (after extracting) ==="
        ls -la

    - name: Delete existing tag and release (only forced releases)
      if: inputs.build_mode == 'build and release (force)'
      run: |
        echo "Deleting tag and release..."
        echo "Tag name: $TAG"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release delete "$TAG" --yes
        else
          echo "No existing release found for $TAG"
        fi

        if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent >/dev/null 2>&1; then
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
        else
          echo "No existing tag found for $TAG"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.version.outputs.tag }}

    - name: Create release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: ${{ needs.version.outputs.tag }}
        body: |
          # Downloads

          ## Installers (Recommended)
          - **VolumeKeeper-Setup-x64.exe** - Installer for 64-bit Windows
          - **VolumeKeeper-Setup-x86.exe** - Installer for 32-bit Windows

          ## Portable Versions
          - **VolumeKeeper-x64.zip** - Portable for 64-bit Windows (extract and run)
          - **VolumeKeeper-x86.zip** - Portable for 32-bit Windows (extract and run)

          # Installation
          **Installer:** Download and run the setup file for automatic installation with Start Menu shortcuts and optional auto-start
          **Portable:** Extract the zip file and run VolumeKeeper.exe - no installation required
        draft: false
        prerelease: false
        files: |
          ./artifacts/VolumeKeeper-x64.zip
          ./artifacts/VolumeKeeper-x86.zip
          ./artifacts/VolumeKeeper-Setup-x64.exe
          ./artifacts/VolumeKeeper-Setup-x86.exe
